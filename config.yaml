project_name: "taskmaster"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # Contestant total points by series were hand-collected from the public
  # Taskmaster (UK) scoreboards, then reconciled against the official
  # per-series cast list for accurate full names. The raw CSV is placed
  # directly in data/raw (no network fetch); the name reference is a page.
  contestant_points:
    url: local
    type: csv
    notes: "Hand-collected total points per contestant per series (S1-S21)."

  cast_reference:
    url: https://en.wikipedia.org/wiki/List_of_Taskmaster_episodes
    type: reference
    notes: "Authoritative per-series contestant full names (used to correct first-name-only data)."

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # no PII in this dataset — public figures, public scores
